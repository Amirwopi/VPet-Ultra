[package]
name = "vpet-transcribe"
version = "0.1.0"
edition = "2021"
description = "Standalone STT CLI for VPet-Ultra, using transcribe-cpp (GGUF v3 + Vulkan)"

[[bin]]
name = "vpet-transcribe"
path = "src/main.rs"

[dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = [
    "dynamic-backends",
] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"