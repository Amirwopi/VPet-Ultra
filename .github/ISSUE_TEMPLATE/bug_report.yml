name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11 22H2, Ubuntu 24.04 (Wine)
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET Version
      placeholder: e.g. 8.0.423
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VPet-Ultra Version
      placeholder: e.g. v0.2.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: AI Mode
      options:
        - Local inference (LLamaSharp)
        - Online (Ollama / OpenAI-compatible)
        - No AI (pet only)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any relevant logs, error messages, or screenshots
      render: shell