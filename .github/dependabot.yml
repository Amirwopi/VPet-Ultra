version: 2
updates:
  # NuGet packages — all projects together (grouped)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps:"
    groups:
      # Group all Panuon updates together so they don't cause version mismatch
      panuon:
        patterns:
          - "Panuon.WPF"
          - "Panuon.WPF.UI"
      # Group all other NuGet packages
      nuget-all:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci:"