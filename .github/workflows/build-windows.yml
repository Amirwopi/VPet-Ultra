name: Build VPet-Ultra (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VPet.sln

      - name: Build (Release)
        run: dotnet build VPet.sln -c Release --no-restore

      - name: Test
        run: dotnet test VPet.Cognition.Tests/VPet.Cognition.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

      - name: Build cognition Host DLL (Release)
        run: dotnet build VPet.Cognition.Host/VPet.Cognition.Host.csproj -c Release --no-restore

      - name: Package cognition plugin
        shell: pwsh
        run: |
          # Create the cognition mod folder structure
          $modPath = "publish/vpet-cognition/mod/0000_cognition"
          New-Item -ItemType Directory -Force -Path $modPath

          # Copy all cognition DLLs into the mod folder
          $hostBin = "VPet.Cognition.Host/bin/Release/net8.0-windows"
          $cognitionDlls = Get-ChildItem -Path $hostBin -Filter "VPet.Cognition.*.dll" -Recurse
          foreach ($dll in $cognitionDlls) {
            Copy-Item $dll.FullName -Destination $modPath -Force
            Write-Host "Copied: $($dll.Name)"
          }

          # Also copy dependency DLLs
          $depDlls = Get-ChildItem -Path $hostBin -Filter "*.dll" -Recurse | Where-Object { $_.Name -notlike "VPet.Cognition.*" -and $_.Name -notlike "VPet-Simulator.*" }
          foreach ($dll in $depDlls) {
            Copy-Item $dll.FullName -Destination $modPath -Force
            Write-Host "Copied dep: $($dll.Name)"
          }

          # Copy LLamaSharp native libraries
          $nativeLibs = Get-ChildItem -Path $hostBin -Filter "*.dll" -Recurse | Where-Object { $_.Name -like "llama.dll" -or $_.Name -like "ggml*.dll" -or $_.Name -like "cuda*.dll" }
          foreach ($lib in $nativeLibs) {
            Copy-Item $lib.FullName -Destination $modPath -Force
            Write-Host "Copied native: $($lib.Name)"
          }

      - name: Create appsettings.json template
        shell: pwsh
        run: |
          $template = @'
          {
            "Cognition": {
              "Enabled": true,
              "Llm": {
                "Provider": "local",
                "Model": "qwen2.5-3b-instruct-q4_k_m",
                "ModelsDirectory": "models",
                "GpuLayerCount": 0,
                "ContextSize": 4096,
                "EnableVision": false,
                "MaxTokens": 1024,
                "Temperature": 0.7,
                "Endpoint": "http://localhost:11434",
                "ApiKey": ""
              },
              "Memory": {
                "DbPath": "data/cognition.db"
              },
              "Voice": {
                "Enabled": false,
                "Stt": {
                  "Provider": "whisper",
                  "ExecutablePath": "whisper-cli.exe",
                  "ModelPath": "models/ggml-base.bin",
                  "Language": "auto",
                  "Threads": 4
                },
                "Tts": {
                  "Provider": "piper",
                  "ExecutablePath": "piper.exe",
                  "ModelPath": "models/en_US-amy-medium.onnx"
                }
              }
            }
          }
          '@
          $template | Out-File -FilePath "publish/vpet-cognition/appsettings.json" -Encoding UTF8

      - name: Create models directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "publish/vpet-cognition/models"

      - name: Copy documentation
        shell: pwsh
        run: |
          Copy-Item "INSTALL.md" -Destination "publish/vpet-cognition/" -Force
          Copy-Item "TESTING.md" -Destination "publish/vpet-cognition/" -Force
          Copy-Item "docs/MODELS.md" -Destination "publish/vpet-cognition/" -Force

      - name: Zip publish folder
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/vpet-cognition/*" -DestinationPath "VPet-Ultra-Cognition.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPet-Ultra-Cognition
          path: VPet-Ultra-Cognition.zip
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VPet-Ultra-Cognition.zip
          name: VPet-Ultra ${{ github.ref_name }}
          body: |
            ## VPet-Ultra ${{ github.ref_name }}

            ### Installation
            1. Download and extract this zip into your VPet folder
            2. Follow the instructions in `INSTALL.md`
            3. Download AI models as described in `MODELS.md`

            ### What's Included
            - VPet.Cognition plugin DLLs (in `mod/0000_cognition/`)
            - `appsettings.json` template (pre-configured for local LLamaSharp + Qwen2.5-3B)
            - Documentation: INSTALL.md, TESTING.md, MODELS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}