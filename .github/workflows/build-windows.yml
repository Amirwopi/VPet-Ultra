name: Build VPet-Ultra (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore VPet.sln

      - name: Build solution (Release x64)
        run: dotnet build VPet.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test VPet.Cognition.Tests/VPet.Cognition.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

      # ── Publish the main VPet application (x64) ──
      - name: Publish VPet-Simulator.Windows (x64)
        run: dotnet publish VPet-Simulator.Windows/VPet-Simulator.Windows.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained false -o publish/vpet-ultra

      # ── Copy the mod/0000_core data folder (pets, food, themes, etc.) ──
      - name: Copy mod data
        shell: pwsh
        run: |
          # Only 0000_core is a real folder; the other mod entries are symlinks
          # to the original developer's local machine. Copy only 0000_core.
          $srcCore = "VPet-Simulator.Windows/mod/0000_core"
          $dstMod = "publish/vpet-ultra/mod"
          $dstCore = "$dstMod/0000_core"
          New-Item -ItemType Directory -Force -Path $dstMod
          if (Test-Path $dstCore) { Remove-Item $dstCore -Recurse -Force }
          Copy-Item -Path $srcCore -Destination $dstCore -Recurse -Force
          $fileCount = (Get-ChildItem $dstCore -Recurse | Measure-Object).Count
          Write-Host "Copied 0000_core ($fileCount files)"

      # ── Build and publish the cognition Host (WPF) ──
      - name: Build cognition Host (Release)
        run: |
          dotnet restore VPet.Cognition.Host/VPet.Cognition.Host.csproj
          dotnet build VPet.Cognition.Host/VPet.Cognition.Host.csproj -c Release

      # ── Copy cognition plugin DLLs into the mod folder ──
      - name: Copy cognition plugin
        shell: pwsh
        run: |
          $modPath = "publish/vpet-ultra/mod/0000_cognition"
          New-Item -ItemType Directory -Force -Path $modPath

          # Create info.lps -- VPet REQUIRES this to recognize a mod folder
          # Without it, the mod loader skips the folder entirely
          $infoLps = 'vupmod#Cognition:|author#VPet-Ultra:|gamever#11000:|ver#100:|intro#AI Cognition Plugin:|authorid#0:|itemid#0:|lang#en:|Cognition#Cognition:|'
          $infoLps | Out-File -FilePath "$modPath/info.lps" -Encoding UTF8
          Write-Host 'Created: info.lps'

          # Create version.txt for update checking
          $version = '0.2.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF.Substring(11)
          }
          $version | Out-File -FilePath "$modPath/version.txt" -Encoding UTF8
          Write-Host "Created: version.txt ($version)"

          # Copy all cognition DLLs
          $hostBin = "VPet.Cognition.Host/bin/Release/net8.0-windows"
          $cognitionDlls = Get-ChildItem -Path $hostBin -Filter "VPet.Cognition.*.dll" -Recurse
          foreach ($dll in $cognitionDlls) {
            Copy-Item $dll.FullName -Destination $modPath -Force
            Write-Host "Copied: $($dll.Name)"
          }

          # Copy dependency DLLs (non-VPet, non-LinePutScript)
          $depDlls = Get-ChildItem -Path $hostBin -Filter "*.dll" -Recurse |
            Where-Object {
              $name = $_.Name
              -not ($name -like 'VPet.Cognition.*' -or $name -like 'VPet-Simulator.*' -or $name -like 'LinePutScript.*' -or $name -like 'Panuon.*' -or $name -like 'steam_api*' -or $name -like 'Facepunch.*' -or $name -like 'NAudio.*' -or $name -like 'Skia*' -or $name -like 'libSkia*' -or $name -like 'WpfAnimatedGif*')
            }
          foreach ($dll in $depDlls) {
            $dest = Join-Path $modPath $dll.Name
            if (-not (Test-Path $dest)) {
              Copy-Item $dll.FullName -Destination $modPath -Force
              Write-Host "Copied dep: $($dll.Name)"
            }
          }

          # Copy LLamaSharp native libraries
          $nativeLibs = Get-ChildItem -Path $hostBin -Filter "*.dll" -Recurse |
            Where-Object { $_.Name -like "llama.dll" -or $_.Name -like "ggml*.dll" -or $_.Name -like "cuda*.dll" }
          foreach ($lib in $nativeLibs) {
            Copy-Item $lib.FullName -Destination $modPath -Force
            Write-Host "Copied native: $($lib.Name)"
          }

      # ── Create appsettings.json ──
      - name: Create appsettings.json
        shell: pwsh
        run: |
          $template = @'
          {
            "Cognition": {
              "Enabled": true,
              "Llm": {
                "Provider": "local",
                "Model": "qwen2.5-3b-instruct-q4_k_m",
                "ModelsDirectory": "models",
                "GpuLayerCount": 0,
                "ContextSize": 4096,
                "EnableVision": false,
                "MaxTokens": 1024,
                "Temperature": 0.7,
                "Endpoint": "http://localhost:11434",
                "ApiKey": ""
              },
              "Memory": {
                "DbPath": "data/cognition.db"
              },
              "Voice": {
                "Enabled": false,
                "Stt": {
                  "Provider": "whisper",
                  "ExecutablePath": "whisper-cli.exe",
                  "ModelPath": "models/ggml-base.bin",
                  "Language": "auto",
                  "Threads": 4
                },
                "Tts": {
                  "Provider": "piper",
                  "ExecutablePath": "piper.exe",
                  "ModelPath": "models/en_US-amy-medium.onnx"
                }
              }
            }
          }
          '@
          $template | Out-File -FilePath "publish/vpet-ultra/appsettings.json" -Encoding UTF8

      # ── Create empty directories ──
      - name: Create runtime directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish/vpet-ultra/models"
          New-Item -ItemType Directory -Force -Path "publish/vpet-ultra/data"
          New-Item -ItemType Directory -Force -Path "publish/vpet-ultra/logs"

      # ── Copy documentation ──
      - name: Copy documentation
        shell: pwsh
        run: |
          Copy-Item "INSTALL.md" -Destination "publish/vpet-ultra/" -Force
          Copy-Item "TESTING.md" -Destination "publish/vpet-ultra/" -Force
          Copy-Item "docs/MODELS.md" -Destination "publish/vpet-ultra/" -Force

      # ── Zip the full package ──
      - name: Zip full package
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/vpet-ultra/*" -DestinationPath "VPet-Ultra-Full.zip" -Force
          $size = [math]::Round((Get-Item "VPet-Ultra-Full.zip").Length / 1MB, 1)
          Write-Host "Full zip: $size MB"

      # ── Zip the cognition plugin only (for updates) ──
      - name: Zip cognition plugin only
        shell: pwsh
        run: |
          $pluginPath = "publish/vpet-cognition-update"
          New-Item -ItemType Directory -Force -Path $pluginPath

          # Copy only the cognition mod folder
          Copy-Item -Path "publish/vpet-ultra/mod/0000_cognition" -Destination "$pluginPath/mod/0000_cognition" -Recurse -Force

          # Copy appsettings.json template
          Copy-Item -Path "publish/vpet-ultra/appsettings.json" -Destination $pluginPath -Force

          # Copy docs
          Copy-Item "INSTALL.md" -Destination $pluginPath -Force
          Copy-Item "TESTING.md" -Destination $pluginPath -Force
          Copy-Item "docs/MODELS.md" -Destination $pluginPath -Force

          Compress-Archive -Path "$pluginPath/*" -DestinationPath "VPet-Ultra-Plugin.zip" -Force
          $size = [math]::Round((Get-Item "VPet-Ultra-Plugin.zip").Length / 1MB, 1)
          Write-Host "Plugin zip: $size MB"

      # Skip artifact upload to avoid storage quota — use Release downloads instead
      # - name: Upload artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: VPet-Ultra-Build
      #     path: |
      #       VPet-Ultra-Full.zip
      #       VPet-Ultra-Plugin.zip
      #     retention-days: 7

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VPet-Ultra-Full.zip
            VPet-Ultra-Plugin.zip
          name: VPet-Ultra ${{ github.ref_name }}
          body: |
            ## VPet-Ultra ${{ github.ref_name }}

            ### دو نوع دانلود — Choose Your Download

            | فایل | حجم | برای چه |
            |---|---|---|
            | `VPet-Ultra-Full.zip` | ~914 MB | **اولین نصب** — کل برنامه + پلاگین AI + داده‌های بازی |
            | `VPet-Ultra-Plugin.zip` | ~50 MB | **آپدیت** — فقط پلاگین AI (اگه قبلا Full رو نصب کردی) |

            ---

            ### Installation (First Time)
            1. Download and extract `VPet-Ultra-Full.zip`
            2. Follow `INSTALL.md` (included in the zip)
            3. Download AI models as described in `MODELS.md`
            4. Run `VPet-Simulator.Windows.exe`
            5. Click the Chat button on the pet's toolbar

            ### Update (Already Installed)
            1. Download `VPet-Ultra-Plugin.zip`
            2. Extract and replace the `mod/0000_cognition/` folder in your existing VPet installation
            3. Replace `appsettings.json` if settings changed
            4. Restart VPet — done!

            ### What's Included (Full)
            - **VPet-Simulator.Windows** — the full desktop pet application (x64)
            - **mod/0000_core** — core game data (pets, food, themes, images)
            - **mod/0000_cognition** — AI cognition plugin (LLamaSharp + all cognition DLLs)
            - `appsettings.json` — pre-configured for local LLamaSharp + Qwen2.5-3B
            - Documentation: INSTALL.md, TESTING.md, MODELS.md

            ### Quick Start
            ```
            1. Download qwen2.5-3b-instruct-q4_k_m.gguf from HuggingFace
            2. Place it in the models/ folder
            3. Run VPet-Simulator.Windows.exe
            4. Click Chat on the pet's toolbar
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}